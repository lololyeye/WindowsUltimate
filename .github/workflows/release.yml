# Every push to the main branch builds, tests and publishes a new GitHub Release (v1.0.<run number>)
# containing the installer and its SHA-256 checksum. The app checks the latest release at startup
# and offers the update to the user.
name: Release

on:
  push:
    branches: [master, main]
    paths-ignore: ['**.md', 'website/**', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set version
        shell: pwsh
        run: echo "VERSION=1.0.${{ github.run_number }}" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test WindowsUltimate.sln -c Release

      - name: Publish
        run: >
          dotnet publish src/WindowsUltimate.App -c Release -r win-x64 --self-contained true -o publish/win-x64
          -p:Version=${{ env.VERSION }} -p:UpdateRepository=${{ github.repository }}

      - name: Build installer and checksum
        shell: pwsh
        run: |
          # The wizard's licence page: LICENSE.md with a UTF-8 BOM, so Inno Setup reads it as UTF-8.
          Get-Content LICENSE.md -Raw -Encoding utf8 | Set-Content installer\license.txt -Encoding utf8BOM -NoNewline
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:VERSION" installer\WindowsUltimate.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $name = "WindowsUltimate-$env:VERSION-setup.exe"
          $hash = (Get-FileHash "artifacts\$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "artifacts\$name.sha256" -Value "$hash  $name" -Encoding ascii -NoNewline

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "WindowsUltimate-$env:VERSION-setup.exe"
          gh release create "v$env:VERSION" "artifacts\$name" "artifacts\$name.sha256" `
            --title "Windows Ultimate $env:VERSION" --generate-notes --target $env:GITHUB_SHA
